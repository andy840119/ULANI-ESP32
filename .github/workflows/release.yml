# Builds the firmware for the two common chips and attaches the flashable
# binaries to a GitHub Release.
#
# There is no over-the-air update (see issue #22): the board is flashed over
# USB from the browser with a web esptool. All this has to do is make the exact
# binaries for a version downloadable, so the flashing guide in docs/flashing.md
# has something to point at.
#
# Runs on a version tag (see docs/releasing.md for the yyyy.mmdd.count scheme).
# The web UI is built on the runner first -- the firmware embeds it, and the
# ESP-IDF container has no Node -- then the IDF build runs in the container,
# once per target, and picks up the staged assets.
name: release

on:
  push:
    tags:
      - '20[0-9][0-9].*' # yyyy.mmdd.count, e.g. 2026.0904.0
  workflow_dispatch: # build binaries off a branch without tagging

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets to it
    strategy:
      fail-fast: false # one chip failing should not bin the other's binaries
      matrix:
        target: [esp32c3, esp32s3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Vite build + gzip into components/web_server/www, where CMake embeds it.
      # Target-independent, but cheap enough to redo per matrix job.
      - name: Build and stage the web UI
        run: python3 tools/build_web.py

      # merge-bin folds bootloader + partition table + app into one image that
      # flashes at offset 0 -- the single file the web flasher asks the user for.
      # ULANI_FW_VERSION becomes the firmware version (PROJECT_VER). A tag build
      # stamps the tag, e.g. 2026.0905.0; a manual dispatch off a branch stays
      # "dev" (the CMake default), so only tagged builds read as production.
      - name: Build firmware (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          command: >-
            ULANI_FW_VERSION='${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}'
            idf.py build &&
            idf.py merge-bin -o ulani-${{ matrix.target }}-merged.bin

      # Both targets emit an identically-named ulani_esp32.bin, so stamp the
      # chip into every filename. The merged image is the only thing a user
      # needs; the separate pieces ride along as run artifacts for debugging.
      - name: Collect the binaries
        run: |
          mkdir -p dist
          T=${{ matrix.target }}
          cp build/ulani-$T-merged.bin                  dist/
          cp build/ulani_esp32.bin                      dist/ulani-$T.bin
          cp build/bootloader/bootloader.bin            dist/bootloader-$T.bin
          cp build/partition_table/partition-table.bin  dist/partition-table-$T.bin
          cp build/flasher_args.json                    dist/flasher_args-$T.json
          ls -l dist

      # The full set, for debugging a build; available from the run page even
      # for an untagged manual dispatch. Not what users flash.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulani-${{ matrix.target }}-firmware
          path: dist/*

      # The release carries only the one file a user flashes: the merged image
      # (bootloader + partition table + app) that goes to offset 0x0.
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ulani-${{ matrix.target }}-merged.bin
          fail_on_unmatched_files: true
