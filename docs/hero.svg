<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8577"/>
    </marker>
  </defs>

  <!-- banner panel -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="#faf8f3" stroke="#e7e2d6" stroke-width="2"/>

  <!-- title -->
  <text x="600" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">一片 ESP32，讓 ULANI 日曆變成 Tesserae 底下的一台裝置</text>

  <!-- ===================== Tesserae ===================== -->
  <g>
    <rect x="138" y="96" width="64" height="64" rx="14" fill="#149b8b"/>
    <rect x="144" y="102" width="22" height="22" rx="4" fill="#ffffff"/>
    <rect x="174" y="102" width="22" height="22" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="144" y="132" width="22" height="22" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="174" y="132" width="22" height="22" rx="4" fill="#ffffff"/>
    <text x="170" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#14877a">Tesserae</text>
    <text x="170" y="226" text-anchor="middle" font-size="15" fill="#6b6b6b">自架服務</text>
    <text x="170" y="246" text-anchor="middle" font-size="15" fill="#6b6b6b">產生日曆畫面</text>
  </g>

  <!-- arrow: Tesserae -> ESP32 (WiFi) -->
  <g>
    <line x1="300" y1="150" x2="470" y2="150" stroke="#8a8577" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="338" y="122" width="94" height="26" rx="13" fill="#eef1ee" stroke="#d9ddd6"/>
    <text x="385" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#4a5560">WiFi 抓圖</text>
  </g>

  <!-- ===================== ESP32 ===================== -->
  <g>
    <rect x="558" y="100" width="84" height="56" rx="8" fill="#2f3a44"/>
    <rect x="587" y="115" width="26" height="26" rx="3" fill="#cfd6dd"/>
    <g stroke="#2f3a44" stroke-width="3">
      <line x1="566" y1="156" x2="566" y2="164"/><line x1="578" y1="156" x2="578" y2="164"/>
      <line x1="590" y1="156" x2="590" y2="164"/><line x1="602" y1="156" x2="602" y2="164"/>
      <line x1="614" y1="156" x2="614" y2="164"/><line x1="626" y1="156" x2="626" y2="164"/>
    </g>
    <text x="600" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#2f3a44">ESP32</text>
    <text x="600" y="226" text-anchor="middle" font-size="15" fill="#6b6b6b">本專案韌體</text>
    <text x="600" y="246" text-anchor="middle" font-size="15" fill="#6b6b6b">常駐在日曆旁</text>
  </g>

  <!-- arrow: ESP32 -> ULANI (Bluetooth) -->
  <g>
    <line x1="730" y1="150" x2="900" y2="150" stroke="#8a8577" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="768" y="122" width="94" height="26" rx="13" fill="#eef1ee" stroke="#d9ddd6"/>
    <text x="815" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#4a5560">藍牙送圖</text>
  </g>

  <!-- ===================== ULANI ===================== -->
  <g>
    <rect x="988" y="98" width="84" height="62" rx="8" fill="#ffffff" stroke="#2f3a44" stroke-width="3"/>
    <!-- Spectra-6 style colour cells -->
    <g>
      <rect x="997"  y="107" width="15" height="20" rx="2" fill="#111111"/>
      <rect x="1015" y="107" width="15" height="20" rx="2" fill="#f2efe6"/>
      <rect x="1033" y="107" width="15" height="20" rx="2" fill="#c0392b"/>
      <rect x="1051" y="107" width="15" height="20" rx="2" fill="#e6c200"/>
      <rect x="997"  y="131" width="15" height="20" rx="2" fill="#2e5aac"/>
      <rect x="1015" y="131" width="15" height="20" rx="2" fill="#2e8b57"/>
      <rect x="1033" y="131" width="15" height="20" rx="2" fill="#d2691e"/>
      <rect x="1051" y="131" width="15" height="20" rx="2" fill="#f2efe6"/>
    </g>
    <text x="1030" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">ULANI 日曆</text>
    <text x="1030" y="226" text-anchor="middle" font-size="15" fill="#6b6b6b">藍牙電子紙</text>
    <text x="1030" y="246" text-anchor="middle" font-size="15" fill="#6b6b6b">顯示畫面</text>
  </g>

  <!-- footnote -->
  <text x="600" y="292" text-anchor="middle" font-size="14" fill="#9a9689">不需要官方 App，也不需要一台開著藍牙的電腦</text>
</svg>
